name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Copy SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./id_rsa
          chmod 600 ./id_rsa

      - name: Copy files to server
        run: scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_rsa ./* root@"${{ secrets.SERVER_IP }}":/root/overpass-api-proxy

      - name: Setup virtual environment and install requirements
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_rsa root@"${{ secrets.SERVER_IP }}" << 'EOF'
          set -e
          cd /root/overpass-api-proxy
          python3.13 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          EOF

      - name: Deploy fastapi.service
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_rsa root@"${{ secrets.SERVER_IP }}" << 'EOF'
          set -e
          cp /root/overpass-api-proxy/deploy/fastapi.service /etc/systemd/system/fastapi.service
          systemctl daemon-reload
          systemctl restart fastapi.service || systemctl start fastapi.service
          find /root/overpass-api-proxy -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          EOF
